name: Test Tay Du Ky MCP

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test MCP handshake and tools
        run: |
          npx -y @modelcontextprotocol/inspector --cli \
            npx -y tay-du-ky-mcp@1.0.1 \
            --method tools/list
